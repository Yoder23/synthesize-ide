name: Submission readiness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'integrations/moa/**'
      - 'scripts/**'
      - '.github/workflows/submission-ready.yml'

jobs:
  rust-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace
      - name: Frontend install
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Frontend build
        run: pnpm build

  moa-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Bridge self-test
        run: python integrations/moa/synthesize_bridge.py --self-test
      - name: Bridge tests
        run: python -m pytest integrations/moa/tests/test_synthesize_bridge.py -q